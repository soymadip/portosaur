[tools]
uv = "latest"
"pipx:commitizen" = "latest"
# Pinned: bun.lock is lockfile v2 (bun 1.4+). Netlify's image ships bun
# 1.3.12, which cannot parse it and silently ignores the lockfile —
# an exact pin makes mise install a bun that reads it.
bun = "1.4.4"
node = "24"
prettier = "latest"

[env]
CZ_CONFIG = 'src/cz/cz.yaml'

[shell_alias]
porto = './packages/cli/bin/porto.ts'

[tasks]
bump = "cz --config $CZ_CONFIG  bump"
commit = "cz --config $CZ_CONFIG commit"
changelog = "cz --config $CZ_CONFIG changelog"
pr = "gh pr create"
"format:check" = "prettier --check ."
format = "prettier --write ."

[tasks.changelog-latest]
run = """
#!/usr/bin/env bash
tag=${1:-$(git describe --tags --abbrev=0 HEAD)}

changelog=$(cz --config $CZ_CONFIG changelog $tag --dry-run | sed -n '/^###/,$p')

if [[ -n "$changelog" ]]; then
  echo "## What's New?"
  echo "$changelog"
else
  echo "No changes to note."
fi
"""
